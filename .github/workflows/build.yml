name: Build Lonya plush

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build mod
        run: ./gradlew build --no-daemon --console=plain
      - name: Upload installable JAR
        uses: actions/upload-artifact@v4
        with:
          name: lonya-plush-${{ github.run_number }}
          path: |
            build/libs/lonya_plush-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
